server:
  port: 3000

spring:
  jackson:
    deserialization:
      # Decision amounts here are money. Without this, Jackson reads a JSON decimal into
      # a Double, which keeps about 15 significant digits. LexQ computes in decimal and
      # rounds only where a rule sets `rounding`, so a result can be longer than that, and
      # the price this service returns would differ from the one LexQ decided.
      use-big-decimal-for-floats: true

lexq:
  # https://api.lexq.io
  api-url: ${LEXQ_API_URL:https://api.lexq.io}
  # your API key, kept on the server and never shipped to a browser
  api-key: ${LEXQ_API_KEY}
  # the policy group to evaluate against
  group-id: ${LEXQ_GROUP_ID}