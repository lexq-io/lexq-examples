# Checks both tracks on every pull request and every push to main. The TypeScript
# job installs from the lockfile and type-checks, and the Java job compiles, so a
# dependency update or an edit that breaks one of those steps fails here.
#
# It makes no calls to LexQ. They need an API key and a deployed policy, and a pull
# request from a fork is not given repository secrets.

name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: typescript/.nvmrc # the major version in package.json engines
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      # npm ci fails when the lockfile no longer matches package.json, so CI checks the
      # versions a reader actually installs.
      - run: npm ci

      # tsx strips types without checking them, so `npm run dev` runs code even when
      # it has type errors. This step reports them.
      - run: npm run typecheck

  java:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17 # java.version in pom.xml
          cache: maven

      - run: ./mvnw -B -ntp compile
