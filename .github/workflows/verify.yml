# These examples are a hand-maintained copy of the LexQ contract. Nothing syncs
# them when the engine changes, so the only thing standing between a contract
# change and a reader pasting broken code is this workflow.
#
# It compiles both tracks. That will not catch a value that changed meaning, but
# it does catch the failures that actually happen here: a response field that
# disappeared, an enum that was renamed, a type that stopped lining up. Those are
# the ones that reach a reader as a compile error in their own editor.
#
# No network calls to LexQ. A test that needs a live key and a deployed policy
# cannot run on a fork's pull request, and a gate that only runs sometimes is not
# a gate.

name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: typescript/.nvmrc # the floor in package.json engines
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      # npm ci fails when the lockfile no longer matches package.json, so CI checks the
      # versions a reader actually installs.
      - run: npm ci

      # tsx strips types without checking them, so `npm run dev` passing proves
      # nothing about the contract. This is the check.
      - run: npm run typecheck

  java:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17 # java.version in pom.xml
          cache: maven

      - run: ./mvnw -B -ntp compile
